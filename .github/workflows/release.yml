name: Release

# Builds Windows (portable ZIP + NSIS installer) and Linux (deb + AppImage)
# artifacts from a v* tag, validates them, generates categorized release notes,
# writes SHA256SUMS.txt and publishes a GitHub release.
#
# Pushing a tag is the normal entry point:
#   git tag v1.4.0 && git push origin v1.4.0
# Use workflow_dispatch to rebuild an existing tag without moving it.

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to build and publish (for example v1.4.0)"
        required: true
        type: string

permissions:
  contents: write
  statuses: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate version and tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check VERSION, tag and metadata
        id: meta
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::VERSION is not MAJOR.MINOR.PATCH: '$version'"
            exit 1
          fi
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "::error::tag $RELEASE_TAG does not match VERSION (v$version)"
            exit 1
          fi
          node scripts/update-version.mjs --check "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Building Postwoman v$version from $RELEASE_TAG"

  windows:
    name: Build Windows assets
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 1
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
          Add-Content $env:GITHUB_PATH (Join-Path (go env GOPATH) 'bin')
      - name: Install MinGW-w64 for CGO/SQLite
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candidates = @("C:\mingw64\bin", "C:\msys64\mingw64\bin", "C:\ProgramData\chocolatey\bin")
          $mingw = $candidates | Where-Object { Test-Path (Join-Path $_ "gcc.exe") } | Select-Object -First 1
          if (-not $mingw) {
            choco install mingw --no-progress -y
            $mingw = "C:\ProgramData\chocolatey\bin"
          }
          if (-not (Test-Path (Join-Path $mingw "gcc.exe"))) {
            throw "gcc.exe was not found after installing MinGW"
          }
          Add-Content $env:GITHUB_PATH $mingw
          Add-Content $env:GITHUB_ENV "MINGW_BIN=$mingw"
          & (Join-Path $mingw "gcc.exe") --version | Select-Object -First 1
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} "NSIS"),
            (Join-Path $env:ProgramFiles "NSIS"),
            "C:\ProgramData\chocolatey\lib\nsis\tools",
            "C:\ProgramData\chocolatey\bin"
          )
          $nsis = $candidates | Where-Object { $_ -and (Test-Path (Join-Path $_ "makensis.exe")) } | Select-Object -First 1
          if (-not $nsis) { throw "NSIS was not installed correctly" }
          Add-Content $env:GITHUB_PATH $nsis
          Add-Content $env:GITHUB_ENV "NSIS_DIR=$nsis"
          & (Join-Path $nsis "makensis.exe") -VERSION
      - name: Verify Windows toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($tool in @("go", "node", "npm", "gcc", "makensis", "wails")) {
            $command = Get-Command $tool -ErrorAction SilentlyContinue
            if (-not $command) { throw "$tool was not found in PATH" }
            Write-Host "$tool -> $($command.Source)"
          }
          & go version
          & node --version
          & npm --version
          & gcc --version | Select-Object -First 1
          & makensis -VERSION
          & wails version
      - name: Build portable ZIP and installer
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $log = "build-windows.log"
          & pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/build-windows.ps1 -Version $env:VERSION *>&1 |
            Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content $log -Tail 100 | ForEach-Object { Write-Host "::error::$_" }
            $tail = ((Get-Content $log -Tail 10 | Out-String).Trim()) -replace "`r?`n", " | "
            if ($tail.Length -gt 130) { $tail = $tail.Substring($tail.Length - 130) }
            "### Windows build failure`n`n$tail" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            $repo = '${{ github.repository }}'
            $sha = '${{ github.sha }}'
            try {
              & gh api "repos/$repo/statuses/$sha" -f state=failure -f context="windows-build" -f description="$tail" | Out-Null
            } catch {
              Write-Host "could not post diagnostic status: $_"
            }
            exit $code
          }
      - name: Upload Windows build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: build-windows.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate Windows outputs
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $dir = "dist\windows"
          $expected = @(
            "Postwoman-v$env:VERSION-windows-x64-portable.zip",
            "Postwoman-v$env:VERSION-windows-x64-setup.exe"
          )
          foreach ($name in $expected) {
            $path = Join-Path $dir $name
            if (-not (Test-Path $path)) { throw "missing asset $name" }
            if ((Get-Item $path).Length -lt 1000) { throw "asset is empty $name" }
          }
          $exe = Join-Path $dir "Postwoman-v$env:VERSION-windows-x64-setup.exe"
          $vi = (Get-Item $exe).VersionInfo
          $product = "$($vi.ProductVersion)"
          $file = "$($vi.FileVersion)"
          if (-not ($product.StartsWith($env:VERSION) -or $file.StartsWith($env:VERSION))) {
            throw "installer version '$product' / '$file' does not match $env:VERSION"
          }
          Write-Host "installer version: product='$product' file='$file'"
          Get-ChildItem $dir -File | Select-Object Name, Length
      - name: Upload Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            dist/windows/*.zip
            dist/windows/*.exe
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Build Linux assets
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 1
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            squashfs-tools file
      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run backend tests
        run: go test ./...
      - name: Build Debian package and AppImage
        run: ./scripts/build-linux.sh
      - name: Validate Linux artifacts
        run: ./scripts/verify-release-assets.sh dist/linux "${{ needs.validate.outputs.version }}" linux
      - name: Upload Linux assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            dist/linux/*.deb
            dist/linux/*.AppImage
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [validate, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate categorized release notes
        run: |
          node scripts/generate-release-notes.mjs "${{ needs.validate.outputs.version }}" \
            --out release-notes.md --no-changelog
          sed -n '1,40p' release-notes.md
      - name: Validate all assets and write checksums
        run: |
          chmod +x dist/*.AppImage 2>/dev/null || true
          ./scripts/verify-release-assets.sh dist "${{ needs.validate.outputs.version }}" all
      - name: Report publish diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          ls -la dist || true
          listing="$(ls dist 2>/dev/null | tr '\n' ' ' | cut -c1-110)"
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=failure -f context="release-publish" \
            -f description="assets: $listing" >/dev/null 2>&1 || true
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.validate.outputs.tag }}"
          VERSION="${{ needs.validate.outputs.version }}"
          mapfile -t ASSETS < <(find dist -maxdepth 1 -type f | LC_ALL=C sort)
          for asset in "${ASSETS[@]}"; do
            [ -s "$asset" ] || { echo "::error::empty asset $asset"; exit 1; }
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; updating assets and notes"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" \
              --title "Postwoman v$VERSION" \
              --notes-file release-notes.md \
              --draft=false
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "Postwoman v$VERSION" \
              --notes-file release-notes.md \
              --verify-tag
          fi
      - name: Release summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ needs.validate.outputs.tag }}" \
            --json tagName,url,isDraft,isPrerelease,assets \
            --jq '"Released \(.tagName) - \(.url)\nDraft: \(.isDraft)  Prerelease: \(.isPrerelease)\nAssets:\n\(.assets[] | "  - \(.name) (\(.size) bytes)")"'
